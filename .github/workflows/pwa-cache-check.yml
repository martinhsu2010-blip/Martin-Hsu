name: Game checks (cache version + syntax)
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'tools/**', '.github/**']
  pull_request:
    paths-ignore: ['**.md']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Check CACHE bump
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE=${{ github.event.pull_request.base.sha }}; HEAD=${{ github.event.pull_request.head.sha }}
            EXTRA=--warn-only
          else
            BASE=${{ github.event.before }}; HEAD=${{ github.sha }}
          fi
          python3 .github/scripts/check_cache.py "$BASE" "$HEAD" $EXTRA
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Syntax check index.html scripts and PRECACHE files
        run: python3 tools/test/syntax_check.py

      - name: Check bilingual strings and untranslated CJK
        run: python3 tools/test/i18n_check.py
      - name: Check locale defaults and live refresh
        run: node tools/test/i18n_check.mjs
      - name: Check traffic route footprints and road heights
        run: node tools/test/route_legality.mjs
      - name: Check traffic pools, exclusion, spacing and reactivation
        run: node tools/test/traffic_check.mjs
      - name: Check tree and house collider alignment, activation and impacts
        run: node tools/test/collision_check.mjs
      - name: Check Option B populations, placement clearances and render batches
        run: node tools/test/suburb_check.mjs
      - name: Check urban infill placement, registration and batch budgets
        run: node tools/test/urban_check.mjs
      - name: Check Game Hub Next Stop card (T-007)
        run: node tools/test/explore_picks_check.mjs
      - name: Check Zone Arrival HUD notice (T-008)
        run: node tools/test/zone_arrival_check.mjs
      - name: Check Midtown crosswalk pilot (T-009)
        run: node tools/test/midtown_crosswalk_check.mjs
      - name: Check Midtown facade pilot (T-010)
        run: node tools/test/midtown_facade_pilot_check.mjs
      - name: Check Midtown West fast travel (T-011)
        run: node tools/test/midtown_west_travel_check.mjs
      - name: Check Midtown streetscape quality (T-012)
        run: node tools/test/midtown_streetscape_quality_check.mjs
      - name: Check Midtown art quality (T-013)
        run: node tools/test/midtown_art_quality_check.mjs
